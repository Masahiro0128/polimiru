<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polimiru｜政治家の発言と実績を見える化する</title>
    <meta name="description" content="Polimiruは、政治家の公約・発言・実績を整理し、理性的な投票判断の材料を提供するプラットフォームです。">
    <link rel="canonical" href="https://polimiru.jp/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Polimiru｜政治家の発言と実績を見える化する">
    <meta property="og:description" content="Polimiruは、政治家の公約・発言・実績を整理し、理性的な投票判断の材料を提供するプラットフォームです。">
    <meta property="og:url" content="https://polimiru.jp/">
    <meta property="og:image" content="https://polimiru.jp/images/polimiru_ogp.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Polimiru｜政治家の発言と実績を見える化する">
    <meta name="twitter:description" content="Polimiruは、政治家の公約・発言・実績を整理し、理性的な投票判断の材料を提供するプラットフォームです。">
    <meta name="twitter:image" content="https://polimiru.jp/images/polimiru_ogp.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/elections.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>

    <!-- ヒーロー -->
    <div class="platform-hero">
        <div class="hero-container">
            <div class="hero-content">
                <h1>政治を、<br>もっと<span class="transparent-word">透明に。</span></h1>
                <p class="hero-lead">
                    「言ったこと」と「やったこと」のギャップを可視化し、<br>
                    あなたの意思決定を支える、信頼できる政治情報を届けます。
                </p>
                <div class="hero-features">
                    <div class="hero-feature-item">
                        <i class="fa-solid fa-shield-halved feature-icon"></i>
                        <div class="feature-text">
                            <div class="feature-title">公約と実績を比較・可視化</div>
                            <div class="feature-desc">言葉と行動の一致度をスコアで評価</div>
                        </div>
                    </div>
                    <div class="hero-feature-item">
                        <i class="fa-solid fa-magnifying-glass feature-icon"></i>
                        <div class="feature-text">
                            <div class="feature-title">一次情報に基づく検証</div>
                            <div class="feature-desc">議会資料・公的データを厳格に確認</div>
                        </div>
                    </div>
                    <div class="hero-feature-item">
                        <i class="fa-solid fa-people-group feature-icon"></i>
                        <div class="feature-text">
                            <div class="feature-title">中立・非営利の運営</div>
                            <div class="feature-desc">特定の政党・団体に属しません</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="hero-image-wrap"></div>
        </div>
    </div>

    <!-- 検索セクション -->
    <div class="search-section">
        <div class="search-section-inner">
            <div class="search-bar-group">
                <div class="search-input-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="search-input" type="text" placeholder="議員名、選挙区、政党、キーワードで検索">
                </div>
                <button class="search-submit-btn">検索する</button>
            </div>
            <div class="search-v-divider"></div>
            <button class="area-link-btn" onclick="document.getElementById('area-modal').classList.add('active')">
                <i class="fa-solid fa-location-dot area-link-icon"></i>
                <div class="area-link-text">
                    <span class="area-link-title">エリアを設定</span>
                    <span class="area-link-sub">地域を選択して情報を最適化</span>
                </div>
                <i class="fa-solid fa-chevron-right area-link-arrow"></i>
            </button>
        </div>
    </div>

    <div class="search-result-tabs" id="search-result-tabs" style="display:none;">
        <button class="search-result-tab active" data-search-mode="all">すべて</button>
        <button class="search-result-tab" data-search-mode="politicians">政治家</button>
        <button class="search-result-tab" data-search-mode="elections">選挙</button>
    </div>

    <!-- 政治家検索結果（検索時のみ表示） -->
    <div class="container" id="politician-results" style="display:none; margin-bottom:0; padding-bottom:0;">
        <div class="elections-section-header" style="margin-bottom:12px;">
            <div class="elections-header-left">
                <h2 class="elections-section-title" style="font-size:1em; color:#666;">政治家</h2>
            </div>
        </div>
        <div id="politician-grid" style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:32px;"></div>
    </div>

    <!-- 注目の政治家（常時表示、検索結果が出たら非表示） -->
    <div class="featured-politicians-section" id="featured-politicians">
        <div class="featured-politicians-inner">
            <div class="featured-politicians-header">
                <h2 class="featured-politicians-title">注目の政治家</h2>
                <span class="featured-politicians-hint">名前や政党で検索できます</span>
            </div>
            <div class="featured-politicians-row" id="featured-politicians-row"></div>
        </div>
    </div>

    <!-- 選挙一覧 -->
    <div class="container" id="election-results">
        <div class="elections-section-header">
            <div class="elections-header-left">
                <h2 class="elections-section-title">選挙・注目情報</h2>
                <p class="elections-section-subtitle">いま注目すべき選挙・政治の動きをチェック</p>
            </div>
            <div class="elections-header-right">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-category="all" onclick="filterElections('all')">注目</button>
                    <span class="filter-sep">|</span>
                    <button class="filter-btn" data-category="national" onclick="filterElections('national')">国政</button>
                    <span class="filter-sep">|</span>
                    <button class="filter-btn" data-category="local" onclick="filterElections('local')">地方</button>
                </div>
                <a href="bookmarks.html" class="see-all-link saved-link"><i class="fa-regular fa-bookmark" style="font-size:0.85em"></i> 保存済み</a>
                <a href="elections/index.html" class="see-all-link">すべて見る <i class="fa-solid fa-chevron-right" style="font-size:0.7em"></i></a>
            </div>
        </div>

        <div class="election-grid" id="election-grid"></div>
    </div>

    <!-- お知らせ -->
    <div class="container" id="news">
        <div class="elections-section-header">
            <div class="elections-header-left">
                <h2 class="elections-section-title">お知らせ</h2>
                <p class="elections-section-subtitle">サイトの更新情報・新機能のご案内</p>
            </div>
            <a href="news.html" class="see-all-link">すべて見る <i class="fa-solid fa-chevron-right" style="font-size:0.7em"></i></a>
        </div>
        <div class="news-list" data-news-list data-news-limit="3"></div>
    </div>

    <script src="js/elections.js"></script>
    <script src="js/politicians.js"></script>
    <script src="js/likes.js"></script>
    <script src="js/layout.js?v=999"></script>
    <script src="js/news.js"></script>

    <script>
        const grid       = document.getElementById('election-grid');
        const searchInput = document.getElementById('search-input');
        const searchTabs = document.getElementById('search-result-tabs');
        let searchMode = 'all';

        const prefectureImages = {
            "東京都":  "images/tokyo.jpg",
            "大阪府":  "images/osaka.jpg",
            "長崎県":  "images/nagasaki.jpg",
            "新潟県":  "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=600&q=80",
            "国政":    "images/kokkaigizidou.jpg",
            "default": "https://images.unsplash.com/photo-1480796927426-f609979314bd?auto=format&fit=crop&w=600&q=80"
        };

        renderCards('all');
        renderFeaturedPoliticians();

        document.querySelector('.search-submit-btn').addEventListener('click', () => {
            const active = document.querySelector('.filter-btn.active');
            renderCards(active ? active.dataset.category : 'all');
            renderPoliticians();
            updateSearchTabs();
        });

        document.querySelectorAll('.search-result-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                searchMode = btn.dataset.searchMode;
                document.querySelectorAll('.search-result-tab').forEach(tab => tab.classList.remove('active'));
                btn.classList.add('active');
                const active = document.querySelector('.filter-btn.active');
                renderCards(active ? active.dataset.category : 'all');
                renderPoliticians();
                updateSearchTabs();
            });
        });

        function filterElections(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards(category);
        }

        function getUserArea() {
            return localStorage.getItem('my_area_name') || '';
        }

        function renderCards(category) {
            const electionSection = document.getElementById('election-results');
            const query = searchInput.value.trim().toLowerCase();
            if (query && searchMode === 'politicians') {
                electionSection.style.display = 'none';
                return;
            }
            electionSection.style.display = 'block';
            grid.innerHTML = "";

            let data = elections;
            if (category === 'national') data = data.filter(e => e.category === 'national');
            else if (category === 'local') data = data.filter(e => e.category === 'local');

            if (query) {
                data = data.filter(e => {
                    const t = (e.title      || '').toLowerCase();
                    const p = (e.prefecture || '').toLowerCase();
                    const d = (e.desc       || '').replace(/<[^>]+>/g,'').toLowerCase();
                    return t.includes(query) || p.includes(query) || d.includes(query);
                });
            }

            // エリア設定があれば一致する選挙を先頭に
            const userArea = getUserArea();
            if (userArea && !query) {
                data = [...data].sort((a, b) => {
                    const aMatch = (a.prefecture || '').includes(userArea) ? 0 : 1;
                    const bMatch = (b.prefecture || '').includes(userArea) ? 0 : 1;
                    return aMatch - bMatch;
                });
            }

            if (data.length === 0) {
                grid.innerHTML = `<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:60px 0">
                    該当する選挙が見つかりませんでした。</p>`;
                return;
            }

            data.forEach(election => {
                const badgeClass  = election.badgeType === 'national' ? 'badge-national' : 'badge-local';
                const statusClass = (election.status && election.status.includes('注目')) ? 'status-active' : '';
                const isDeadLink  = !election.url || election.url === '#';

                let imageUrl = prefectureImages[election.prefecture] || prefectureImages['default'];
                if (election.image && election.image.startsWith('http')) imageUrl = election.image;

                const tag = isDeadLink ? 'div' : 'a';
                const href = isDeadLink ? '' : `href="${election.url}"`;
                const style = isDeadLink ? 'cursor:default;opacity:0.6' : '';

                const bm = window.pBookmarks;
                const elecSaved = bm ? bm.isBookmarked(String(election.id), 'election') : false;
                grid.insertAdjacentHTML('beforeend', `
                    <${tag} ${href} class="election-card" style="${style}">
                        <div class="card-thumb" style="background-image:url('${imageUrl}')">
                            <span class="badge ${badgeClass}">${election.prefecture}</span>
                            <span class="status-label ${statusClass}">${election.status}</span>
                        </div>
                        <div class="card-content">
                            <div class="election-title">${election.title}</div>
                            <div class="election-date">
                                <i class="fa-regular fa-calendar" style="font-size:0.85em"></i>
                                ${election.date}
                            </div>
                            <div class="election-desc">${election.desc}</div>
                            <div class="card-footer-row">
                                ${!isDeadLink ? `
                                <div class="card-footer-hint">
                                    詳細を見る
                                    <i class="fa-solid fa-arrow-right" style="font-size:0.75em"></i>
                                </div>` : '<div></div>'}
                                <button class="elec-card-bookmark${elecSaved ? ' bookmarked' : ''}"
                                        aria-label="${elecSaved ? '保存済み' : '保存する'}"
                                        onclick="event.preventDefault();event.stopPropagation();toggleElectionBookmark(this,'${election.id}')">
                                    <i class="fa-${elecSaved ? 'solid' : 'regular'} fa-bookmark"></i>
                                </button>
                            </div>
                        </div>
                    </${tag}>
                `);
            });
        }

        searchInput.addEventListener('input', () => {
            const active = document.querySelector('.filter-btn.active');
            renderCards(active ? active.dataset.category : 'all');
            renderPoliticians();
            updateSearchTabs();
        });

        function updateSearchTabs() {
            const query = searchInput.value.trim();
            searchTabs.style.display = query ? 'flex' : 'none';
            if (!query && searchMode !== 'all') {
                searchMode = 'all';
                document.querySelectorAll('.search-result-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.searchMode === 'all');
                });
                document.getElementById('election-results').style.display = 'block';
            }
        }

        function renderFeaturedPoliticians() {
            const row  = document.getElementById('featured-politicians-row');
            const bm   = window.pBookmarks;
            const all  = (window.politicians || []).filter(p => p.url);

            // ブックマーク済み → エリア一致 → デフォルト順
            const userArea = getUserArea();
            const sorted = [...all].sort((a, b) => {
                const aBm   = bm && bm.isBookmarked(a.id) ? 0 : 1;
                const bBm   = bm && bm.isBookmarked(b.id) ? 0 : 1;
                if (aBm !== bBm) return aBm - bBm;
                const aArea = userArea && (a.area || '').includes(userArea) ? 0 : 1;
                const bArea = userArea && (b.area || '').includes(userArea) ? 0 : 1;
                return aArea - bArea;
            });

            row.innerHTML = sorted.slice(0, 8).map(p => {
                const saved = bm ? bm.isBookmarked(p.id) : false;
                return `
                <a href="${p.url}" class="pol-feat-card">
                    ${p.photo
                        ? `<img src="${p.photo}" alt="${p.name}" class="pol-feat-photo"
                               onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                           <div class="pol-feat-initial" style="display:none">${(p.name||'?').replace(/\s+/g,'').slice(0,1)}</div>`
                        : `<div class="pol-feat-initial">${(p.name||'?').replace(/\s+/g,'').slice(0,1)}</div>`
                    }
                    <div class="pol-feat-name">${p.name}</div>
                    <div class="pol-feat-sub">${p.party}</div>
                    <button class="pol-feat-bookmark${saved ? ' bookmarked' : ''}"
                            aria-label="${saved ? '保存済み' : '保存する'}"
                            onclick="event.preventDefault();event.stopPropagation();toggleFeaturedBookmark(this,'${p.id}')">
                        <i class="fa-${saved ? 'solid' : 'regular'} fa-bookmark"></i>
                    </button>
                </a>`;
            }).join('');
        }

        function toggleFeaturedBookmark(btn, id) {
            if (!window.pBookmarks) return;
            const nowSaved = pBookmarks.toggle(id);
            btn.classList.toggle('bookmarked', nowSaved);
            btn.querySelector('i').className = `fa-${nowSaved ? 'solid' : 'regular'} fa-bookmark`;
            btn.setAttribute('aria-label', nowSaved ? '保存済み' : '保存する');
        }

        function toggleElectionBookmark(btn, id) {
            if (!window.pBookmarks) return;
            const nowSaved = pBookmarks.toggle(String(id), 'election');
            btn.classList.toggle('bookmarked', nowSaved);
            btn.querySelector('i').className = `fa-${nowSaved ? 'solid' : 'regular'} fa-bookmark`;
            btn.setAttribute('aria-label', nowSaved ? '保存済み' : '保存する');
        }

        function renderPoliticians() {
            const normalizeSearchText = value => (value || '')
                .toString()
                .toLowerCase()
                .normalize('NFKC')
                .replace(/\s+/g, '');

            const query = normalizeSearchText(searchInput.value);
            const section = document.getElementById('politician-results');
            const grid    = document.getElementById('politician-grid');

            const featured = document.getElementById('featured-politicians');
            if (!query || searchMode === 'elections') {
                section.style.display = 'none';
                featured.style.display = 'block';
                return;
            }

            const politicianData = window.politicians || [];
            const matched = politicianData.filter(p => {
                if (!p.url) return false;
                const haystack = [p.name, p.kana, p.party, p.role, p.area, p.desc, ...(p.tags || [])]
                    .join(' ');
                const normalizedHaystack = normalizeSearchText(haystack);
                return normalizedHaystack.includes(query);
            });

            if (matched.length === 0) {
                section.style.display = 'none';
                featured.style.display = 'block';
                return;
            }

            section.style.display = 'block';
            featured.style.display = 'none';
            grid.innerHTML = matched.map(p => `
                <a href="${p.url}" style="
                    display:flex; align-items:center; gap:12px;
                    background:white; border-radius:12px; padding:14px 18px;
                    text-decoration:none; color:inherit;
                    box-shadow:0 2px 8px rgba(0,0,0,0.07);
                    border:1px solid #eee;
                    transition:box-shadow 0.2s;
                    min-width:260px; max-width:340px;
                " onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,0.12)'"
                   onmouseout="this.style.boxShadow='0 2px 8px rgba(0,0,0,0.07)'">
                    ${p.photo ? `
                        <img src="${p.photo}" alt="${p.name}"
                             style="width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:top; flex-shrink:0; background:#eee;"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    ` : ''}
                    <div style="
                        width:52px; height:52px; border-radius:50%; flex-shrink:0;
                        display:${p.photo ? 'none' : 'flex'}; align-items:center; justify-content:center;
                        background:#edf2f7; color:#334155; font-weight:800;
                    ">${(p.name || '?').replace(/\s+/g, '').slice(0, 1)}</div>
                    <div>
                        <div style="font-weight:bold; font-size:1em; margin-bottom:2px;">${p.name}</div>
                        <div style="font-size:0.78em; color:#888;">${p.party}・${p.role}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="margin-left:auto; color:#ccc; font-size:0.8em;"></i>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
