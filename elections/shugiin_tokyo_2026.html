<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>polimiru | 衆議院選挙（東京）</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header-footer.css">
    <link rel="stylesheet" href="../css/hero.css">
    <link rel="stylesheet" href="../css/elections.css">
    <link rel="stylesheet" href="../css/modal.css">

    <style>
        :root {
            --tokyo-navy: #0f2a43;
            --tokyo-sand: #f5f2ec;
            --tokyo-ink: #1b1f23;
            --tokyo-mist: #6b7280;
            --tokyo-accent: #d95b43;
        }

        body {
            background: var(--tokyo-sand);
        }

        .hero {
            text-align: left;
            padding: 40px 20px 28px;
            background: linear-gradient(135deg, #102a44, #1c3b5b);
            color: white;
        }
        .hero-inner {
            max-width: 1100px;
            margin: 0 auto;
        }
        .hero h1 {
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 0.02em;
        }
        .hero p {
            margin-top: 8px;
            opacity: 0.9;
        }
        .hero-meta {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85em;
            opacity: 0.9;
        }
        .hero-links {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hero-chip {
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 999px;
        }
        .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.86em;
        }

        .page-body {
            max-width: 1100px;
            margin: 18px auto 48px;
            padding: 0 20px;
        }

        .filters {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(15, 42, 67, 0.08);
            display: grid;
            gap: 12px;
            grid-template-columns: 1.4fr 1fr 1fr auto;
            align-items: center;
        }
        .filters label {
            font-size: 0.8em;
            color: var(--tokyo-mist);
            display: block;
            margin-bottom: 6px;
        }
        .filters input,
        .filters select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 0.95em;
        }
        .filters button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: var(--tokyo-accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .summary-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 10px;
            color: var(--tokyo-ink);
        }
        .summary-row .note {
            color: var(--tokyo-mist);
            font-size: 0.9em;
        }

        details.district-block {
            margin: 14px 0;
            border-radius: 14px;
            background: white;
            box-shadow: 0 6px 18px rgba(15, 42, 67, 0.06);
            overflow: hidden;
        }
        details.district-block summary {
            cursor: pointer;
            list-style: none;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 18px 20px;
            background: #f8fafc;
        }
        details.district-block summary::-webkit-details-marker {
            display: none;
        }
        .district-title {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--tokyo-ink);
        }
        .district-meta {
            font-size: 0.85em;
            color: var(--tokyo-mist);
            margin-top: 6px;
        }
        .district-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .link-chip {
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8em;
            color: var(--tokyo-ink);
            text-decoration: none;
            background: white;
        }

        .candidate-grid {
            padding: 18px 20px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .candidate-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #f0f2f5;
            padding: 16px;
            display: grid;
            gap: 12px;
        }
        .candidate-header {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--tokyo-ink);
            flex-shrink: 0;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .candidate-name {
            font-size: 1.05em;
            font-weight: bold;
        }
        .candidate-kana {
            font-size: 0.8em;
            color: var(--tokyo-mist);
        }
        .candidate-desc {
            font-size: 0.85em;
            color: var(--tokyo-mist);
            line-height: 1.5;
        }
        .party-badge {
            display: inline-block;
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 999px;
            background: #eef2ff;
            color: #3730a3;
            margin-top: 4px;
        }

        .score-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            display: grid;
            gap: 6px;
        }
        .score-grid {
            display: grid;
            gap: 8px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: var(--tokyo-ink);
        }
        .score-row span {
            color: var(--tokyo-mist);
        }
        .score-label {
            font-size: 0.8em;
            color: var(--tokyo-mist);
        }
        .score-value {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--tokyo-ink);
        }
        .score-bar {
            height: 6px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            background: var(--tokyo-accent);
        }
        .score-note {
            font-size: 0.75em;
            color: var(--tokyo-mist);
        }

        .link-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .link-row a {
            font-size: 0.8em;
            text-decoration: none;
            color: var(--tokyo-ink);
            border: 1px solid #e5e7eb;
            padding: 6px 10px;
            border-radius: 8px;
            background: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--tokyo-mist);
        }

        @media (max-width: 800px) {
            .filters {
                grid-template-columns: 1fr;
            }
            details.district-block summary {
                grid-template-columns: 1fr;
            }
            .district-actions {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-inner">
            <h1 id="hero-title">衆議院選挙（東京）</h1>
            <p id="hero-dates">公示・投開票の日程を更新中</p>
            <div class="hero-meta">
                <span class="hero-chip" id="hero-updated">最終更新：-</span>
                <span class="hero-chip" id="hero-count">候補者数：-</span>
                <span class="hero-chip" id="hero-districts">選挙区：-</span>
            </div>
            <div class="hero-links">
                <a class="hero-link" href="./shugiin_tokyo_2026_statements.html">
                    <i class="fa-solid fa-comments"></i>
                    候補者発言比較ベータ
                </a>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="filters">
            <div>
                <label for="search-input">名前・かな・政党で検索</label>
                <input id="search-input" type="text" placeholder="例：たなか / 自民 / 5区">
            </div>
            <div>
                <label for="district-filter">選挙区</label>
                <select id="district-filter"></select>
            </div>
            <div>
                <label for="party-filter">政党</label>
                <select id="party-filter"></select>
            </div>
            <div>
                <label>&nbsp;</label>
                <button id="reset-btn" type="button">リセット</button>
            </div>
        </div>

        <div class="summary-row">
            <div class="note" id="source-note"></div>
            <div class="note" id="result-note"></div>
        </div>

        <div id="district-container"></div>
    </div>

    <script src="../js/layout.js?v=10"></script>

    <script>
        const districtContainer = document.getElementById('district-container');
        const heroDates = document.getElementById('hero-dates');
        const heroUpdated = document.getElementById('hero-updated');
        const heroCount = document.getElementById('hero-count');
        const heroDistricts = document.getElementById('hero-districts');
        const sourceNote = document.getElementById('source-note');
        const resultNote = document.getElementById('result-note');
        const searchInput = document.getElementById('search-input');
        const districtFilter = document.getElementById('district-filter');
        const partyFilter = document.getElementById('party-filter');
        const resetBtn = document.getElementById('reset-btn');

        let allCandidates = [];
        let meta = {};

        function formatDate(iso) {
            if (!iso) return '-';
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
        }

        function normalize(text) {
            return (text || '').toString().toLowerCase();
        }

        function computeTransparencyScore(candidate) {
            let score = 0;
            if (candidate.bulletin_pdf) score += 35;
            if (candidate.url) score += 30;
            if (candidate.source_url) score += 20;
            if (candidate.kana) score += 10;
            if (candidate.party && candidate.party !== '記載なし') score += 5;
            return Math.min(score, 100);
        }

        function buildSelectOptions(selectEl, items, labelAll) {
            selectEl.innerHTML = '';
            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = labelAll;
            selectEl.appendChild(allOption);
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.value;
                opt.textContent = item.label;
                selectEl.appendChild(opt);
            });
        }

        function updateFilters() {
            const districts = Array.from(
                new Map(
                    allCandidates
                        .filter(c => c.district)
                        .map(c => [c.district, { value: c.district, label: c.district }])
                ).values()
            );
            const parties = Array.from(
                new Map(
                    allCandidates
                        .filter(c => c.party)
                        .map(c => [c.party, { value: c.party, label: c.party }])
                ).values()
            );

            districts.sort((a, b) => a.label.localeCompare(b.label, 'ja'));
            parties.sort((a, b) => a.label.localeCompare(b.label, 'ja'));

            buildSelectOptions(districtFilter, districts, 'すべて');
            buildSelectOptions(partyFilter, parties, 'すべて');
        }

        function filterCandidates() {
            const query = normalize(searchInput.value);
            const districtValue = districtFilter.value;
            const partyValue = partyFilter.value;

            return allCandidates.filter(candidate => {
                if (districtValue !== 'all' && candidate.district !== districtValue) {
                    return false;
                }
                if (partyValue !== 'all' && candidate.party !== partyValue) {
                    return false;
                }
                if (!query) return true;
                const haystack = normalize(
                    `${candidate.name} ${candidate.kana} ${candidate.party} ${candidate.district}`
                );
                return haystack.includes(query);
            });
        }

        function groupByDistrict(candidates) {
            const map = new Map();
            candidates.forEach(candidate => {
                const key = candidate.district || '未分類';
                if (!map.has(key)) {
                    map.set(key, []);
                }
                map.get(key).push(candidate);
            });
            return map;
        }

        function render() {
            const filtered = filterCandidates();
            const grouped = groupByDistrict(filtered);

            districtContainer.innerHTML = '';

            if (filtered.length === 0) {
                districtContainer.innerHTML = '<div class="empty-state">条件に一致する候補者がいません。</div>';
                resultNote.textContent = '';
                return;
            }

            resultNote.textContent = `表示中：${filtered.length}人`;

            const sortedDistricts = Array.from(grouped.entries()).sort((a, b) => {
                const aNo = a[1][0]?.district_no ?? 999;
                const bNo = b[1][0]?.district_no ?? 999;
                if (aNo !== bNo) return aNo - bNo;
                return a[0].localeCompare(b[0], 'ja');
            });

            sortedDistricts.forEach(([district, candidates]) => {
                const details = document.createElement('details');
                details.className = 'district-block';
                details.open = true;

                const bulletin = candidates.find(c => c.bulletin_pdf)?.bulletin_pdf;

                const summary = document.createElement('summary');
                summary.innerHTML = `
                    <div>
                        <div class="district-title">${district}</div>
                        <div class="district-meta">候補者：${candidates.length}人</div>
                    </div>
                    <div class="district-actions">
                        ${bulletin ? `<a class="link-chip" href="${bulletin}" target="_blank" rel="noopener">選挙公報</a>` : ''}
                    </div>
                `;
                details.appendChild(summary);

                const grid = document.createElement('div');
                grid.className = 'candidate-grid';

                candidates.forEach(candidate => {
                    const overall = candidate.overall_score ?? '-';
                    const scoreLabel = candidate.score_status === '算出'
                        ? 'スコア（算出済み）'
                        : 'スコア（暫定）';
                    const progressScore = candidate.score_progress ?? '-';
                    const consistencyScore = candidate.score_consistency ?? '-';
                    const specificityScore = candidate.score_specificity ?? '-';
                    const transparencyScore = candidate.score_transparency ?? computeTransparencyScore(candidate);
                    const avatarText = candidate.name ? candidate.name.slice(0, 1) : '?';
                    const imageSrc = candidate.image
                        ? (candidate.image.startsWith('http') || candidate.image.startsWith('data:') ? candidate.image : `../${candidate.image}`)
                        : '';
                    const avatarHtml = imageSrc
                        ? `<img src="${imageSrc}" alt="${candidate.name || ''}">`
                        : avatarText;

                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    card.innerHTML = `
                        <div class="candidate-header">
                            <div class="avatar">${avatarHtml}</div>
                            <div>
                                <div class="candidate-name">${candidate.name || '候補者名'}</div>
                                <div class="candidate-kana">${candidate.kana || 'かな情報なし'}</div>
                                <div class="party-badge">${candidate.party || '記載なし'}</div>
                            </div>
                        </div>
                        <div class="score-box">
                            <div class="score-label">${scoreLabel}</div>
                            <div class="score-value">${overall} / 100</div>
                            <div class="score-bar"><div class="score-fill" style="width:${overall === '-' ? 0 : overall}%"></div></div>
                            <div class="score-grid">
                                <div class="score-row">公約進捗 <span>${progressScore}</span></div>
                                <div class="score-row">言行一致 <span>${consistencyScore}</span></div>
                                <div class="score-row">具体性 <span>${specificityScore}</span></div>
                                <div class="score-row">情報公開 <span>${transparencyScore}</span></div>
                            </div>
                            <div class="score-note">公報テキスト要約＋公開情報ベース（暫定）</div>
                        </div>
                        ${candidate.manifesto_text ? `<div class="candidate-desc">${candidate.manifesto_text}</div>` : ''}
                        <div class="link-row">
                            ${candidate.url ? `<a href="${candidate.url}" target="_blank" rel="noopener">公式サイト</a>` : ''}
                            ${candidate.source_url ? `<a href="${candidate.source_url}" target="_blank" rel="noopener">候補者一覧</a>` : ''}
                            ${candidate.bulletin_pdf ? `<a href="${candidate.bulletin_pdf}" target="_blank" rel="noopener">公報PDF</a>` : ''}
                            ${candidate.manifesto_source ? `<a href="${candidate.manifesto_source}" target="_blank" rel="noopener">公報（読み上げ対応）</a>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                details.appendChild(grid);
                districtContainer.appendChild(details);
            });
        }

        async function loadData() {
            try {
                const response = await fetch('../js/data/shugiin_tokyo_2026.json');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const payload = await response.json();
                meta = payload.meta || {};
                allCandidates = Array.isArray(payload.candidates) ? payload.candidates : [];

                if (meta.announced && meta.election_day) {
                    heroDates.textContent = `公示：${meta.announced} / 投開票：${meta.election_day}`;
                }

                heroUpdated.textContent = `最終更新：${formatDate(meta.last_updated)}`;
                heroCount.textContent = `候補者数：${allCandidates.length}人`;

                const districtCount = new Set(allCandidates.map(c => c.district)).size;
                heroDistricts.textContent = `選挙区：${districtCount}区`;

                if (meta.source_note) {
                    sourceNote.textContent = `出典：${meta.source_note}`;
                }

                updateFilters();
                render();
            } catch (error) {
                console.error('Error:', error);
                districtContainer.innerHTML = '<div class="empty-state">データを読み込めませんでした。<br>Live Serverで開いているか確認してください。</div>';
            }
        }

        searchInput.addEventListener('input', render);
        districtFilter.addEventListener('change', render);
        partyFilter.addEventListener('change', render);
        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            districtFilter.value = 'all';
            partyFilter.value = 'all';
            render();
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
