<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>polimiru | 大阪府知事選挙 2027</title>
    <meta property="og:title" content="polimiru | 大阪府知事選挙 2027">
    <meta property="og:description" content="現職の公約達成度と、新候補者のマニフェスト具体性を比較。候補者情報は大阪府選挙管理委員会の公式データをもとに自動更新されます。">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../../../css/base.css">
    <link rel="stylesheet" href="../../../css/header-footer.css">
    <link rel="stylesheet" href="../../../css/elections.css">
    <link rel="stylesheet" href="../../../css/modal.css">
    <link rel="stylesheet" href="../../../css/candidate-modal.css">

    <style>
        body { background: #f5f2ec; }

        .election-hero {
            background: linear-gradient(135deg, #1a3a1a, #2d6a2d);
            color: #fff;
            padding: 40px 20px 32px;
        }
        .election-hero-inner {
            max-width: 1000px;
            margin: 0 auto;
        }
        .election-hero h1 {
            margin: 0 0 8px;
            font-size: 1.7em;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .election-hero p {
            margin: 0 0 16px;
            opacity: 0.88;
            line-height: 1.7;
            font-size: 0.95em;
        }
        .election-hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.82em;
            opacity: 0.85;
        }
        .election-hero-meta span {
            background: rgba(255,255,255,0.15);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .page-body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #666;
            text-decoration: none;
            font-size: 0.85em;
            margin-bottom: 20px;
        }
        .back-link:hover { color: #333; }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
            border-left: 4px solid #2d6a2d;
            padding-left: 12px;
        }
        .section-head h2 {
            margin: 0;
            font-size: 1.1em;
            color: #1a2e45;
        }
        .section-head .count {
            font-size: 0.82em;
            color: #999;
        }

        #loading-msg {
            padding: 40px;
            text-align: center;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="election-hero">
        <div class="election-hero-inner">
            <h1>大阪府知事選挙 2027</h1>
            <p>現職の公約達成度と、新候補者のマニフェスト具体性を比較。<br>候補者情報は大阪府選挙管理委員会の公式データをもとに自動更新されます。</p>
            <div class="election-hero-meta">
                <span><i class="fa-regular fa-calendar"></i> 2027年4月（予定）</span>
                <span><i class="fa-solid fa-location-dot"></i> 大阪府</span>
                <span id="last-updated-chip"><i class="fa-regular fa-clock"></i> 取得中...</span>
            </div>
        </div>
    </div>

    <div class="page-body">
        <a href="../../../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> トップへ戻る
        </a>

        <div id="upcoming-banner" class="upcoming-banner" style="display:none">
            <span class="upcoming-banner-icon">📋</span>
            <div>
                <strong>候補者情報は選挙公示後に更新されます。</strong><br>
                現時点では現職情報のみ掲載しています。立候補が確定した候補者から順次追加されます。
            </div>
        </div>

        <div class="section-head">
            <h2>候補者一覧</h2>
            <span class="count" id="candidate-count"></span>
        </div>

        <div id="loading-msg">候補者データを読み込み中...</div>
        <div class="candidate-grid" id="candidate-grid"></div>
    </div>

    <script src="../../../js/layout.js?v=999"></script>
    <script src="../../../js/candidate-modal.js"></script>
    <script>
        const ELECTION_KEY = 'osaka_2027_governor';

        function partyHeaderClass(party) {
            if (!party) return '';
            if (party.includes('維新')) return 'party-ishin';
            if (party.includes('自由民主') || party.includes('自民')) return 'party-jimin';
            if (party.includes('公明')) return 'party-komei';
            return 'party-other';
        }

        function renderScoreSummary(c) {
            if (c.role === 'incumbent') {
                const v = c.score_incumbent;
                return `
                    <div class="cand-card-score-area">
                        <span class="cand-card-score-label">現職評価（総合）</span>
                        ${v !== null && v !== undefined
                            ? `<span class="cand-card-score-value">${v}<small style="font-size:0.55em;color:#999"> /100</small></span>`
                            : '<span class="cand-card-score-pending">集計中</span>'}
                    </div>`;
            }
            if (c.role === 'challenger') {
                const v = c.score_challenger;
                return `
                    <div class="cand-card-score-area">
                        <span class="cand-card-score-label">新人評価（公約具体性）</span>
                        ${v !== null && v !== undefined
                            ? `<span class="cand-card-score-value type-challenger">${v}<small style="font-size:0.55em;color:#999"> /100</small></span>`
                            : '<span class="cand-card-score-pending">公約情報収集中</span>'}
                    </div>`;
            }
            return `<div class="cand-card-score-area"><span class="cand-card-score-pending">情報準備中</span></div>`;
        }

        function renderCard(c) {
            const initial = (c.name || '?').replace(/\s+/g, '').slice(0, 1) || '?';
            const photo = c.image
                ? `<img src="${c.image}" class="cand-card-photo" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` +
                  `<div class="cand-card-photo-placeholder" style="display:none">${initial}</div>`
                : `<div class="cand-card-photo-placeholder">${initial}</div>`;

            const roleBadge = c.role === 'incumbent'
                ? '<span class="cand-badge cand-badge-incumbent">現職</span>'
                : c.role === 'challenger'
                    ? '<span class="cand-badge cand-badge-challenger">新人</span>'
                    : '';

            const unconfirmed = !c.confirmed
                ? '<span class="cand-badge cand-badge-unconfirmed">出馬未確定</span>'
                : '';

            const cardTag = c.profile_url ? 'a' : 'div';
            const cardAttrs = c.profile_url
                ? `href="${c.profile_url}"`
                : `data-election="${ELECTION_KEY}" data-candidate-id="${c.id}" role="button" tabindex="0"`;

            return `
                <${cardTag} class="cand-card ${partyHeaderClass(c.party)}" ${cardAttrs} style="text-decoration:none;color:inherit">
                    ${photo}
                    <div class="cand-card-name">${c.name}</div>
                    <div class="cand-card-party">${c.party || ''}</div>
                    <div class="cand-card-badges">${roleBadge}${unconfirmed}</div>
                    ${renderScoreSummary(c)}
                    <div class="cand-card-detail-hint">詳細を見る <i class="fa-solid fa-arrow-right" style="font-size:0.8em"></i></div>
                </${cardTag}>`;
        }

        function getDataBase() {
            const path = window.location.pathname;
            const dir  = path.replace(/\/[^\/]*$/, '/');
            if (dir.includes('/polimiru/')) {
                const subdir = dir.replace(/^.*\/polimiru\//, '');
                const depth  = subdir.split('/').filter(Boolean).length;
                return '../'.repeat(depth) || './';
            }
            const parts = dir.split('/').filter(Boolean);
            return parts.length === 0 ? './' : '../'.repeat(parts.length);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const base = getDataBase();
            fetch(`${base}js/data/${ELECTION_KEY}/index.json`)
                .then(r => r.json())
                .then(data => {
                    const grid   = document.getElementById('candidate-grid');
                    const msg    = document.getElementById('loading-msg');
                    const count  = document.getElementById('candidate-count');
                    const chip   = document.getElementById('last-updated-chip');
                    const banner = document.getElementById('upcoming-banner');

                    msg.style.display = 'none';

                    const candidates = data.candidates || [];
                    count.textContent = `${candidates.length}名`;

                    if (data.meta?.status === 'upcoming') {
                        banner.style.display = 'flex';
                    }

                    if (data.meta?.last_updated) {
                        const d = new Date(data.meta.last_updated);
                        chip.innerHTML = `<i class="fa-regular fa-clock"></i> 更新: ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
                    }

                    grid.innerHTML = candidates.map(renderCard).join('');

                    grid.querySelectorAll('.cand-card').forEach(el => {
                        el.addEventListener('keydown', e => {
                            if (e.key === 'Enter' || e.key === ' ') el.click();
                        });
                    });
                })
                .catch(() => {
                    document.getElementById('loading-msg').textContent = 'データを取得できませんでした。';
                });
        });
    </script>

</body>
</html>
