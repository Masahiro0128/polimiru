<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保存済みリスト | polimiru</title>
    <meta name="description" content="ブックマークした政治家・選挙の一覧">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/elections.css">
    <link rel="stylesheet" href="css/modal.css">

    <style>
        .saved-hero {
            background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
            color: #fff;
            padding: 48px 24px 40px;
            text-align: center;
        }
        .saved-hero h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .saved-hero p {
            margin: 0;
            opacity: 0.75;
            font-size: 0.9rem;
        }
        .saved-hero i {
            font-size: 2rem;
            margin-bottom: 12px;
            display: block;
            opacity: 0.9;
        }

        .saved-body {
            max-width: 1060px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .saved-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            border-left: 3px solid var(--navy-700);
            padding-left: 10px;
            margin: 0 0 20px;
        }
        .saved-section-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 8px;
        }
        .saved-section + .saved-section {
            margin-top: 48px;
        }

        /* 政治家カード */
        .pol-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .pol-saved-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 16px 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
            position: relative;
        }
        .pol-saved-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--navy-200);
        }
        .pol-saved-photo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--navy-200);
        }
        .pol-saved-placeholder {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--navy-700);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            flex-shrink: 0;
        }
        .pol-saved-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .pol-saved-kana {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .pol-saved-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .pol-saved-party {
            display: inline-block;
            background: var(--navy-50);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .pol-saved-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            font-size: 0.8rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .pol-saved-remove:hover { color: #c0392b; }

        /* 選挙グリッド */
        .elec-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .elec-saved-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.45);
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1;
            z-index: 2;
            transition: background 0.15s;
        }
        .elec-saved-remove:hover { background: rgba(192,57,43,0.85); }
        .election-card { position: relative; }

        /* 空状態 */
        .empty-state {
            color: var(--text-muted);
            font-size: 0.88rem;
            padding: 32px 0;
            text-align: center;
        }
        .empty-state i {
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="saved-hero">
        <i class="fa-solid fa-bookmark"></i>
        <h1>保存済みリスト</h1>
        <p>ブックマークした政治家・選挙が一覧で確認できます</p>
    </div>

    <div class="saved-body">

        <section class="saved-section">
            <h2 class="saved-section-title">
                政治家
                <span class="saved-section-sub">politicians</span>
            </h2>
            <div id="pol-grid" class="pol-card-grid">
                <p class="empty-state"><i class="fa-regular fa-bookmark"></i>読み込み中...</p>
            </div>
        </section>

        <section class="saved-section">
            <h2 class="saved-section-title">
                選挙
                <span class="saved-section-sub">elections</span>
            </h2>
            <div id="elec-grid" class="elec-card-grid">
                <p class="empty-state"><i class="fa-regular fa-bookmark"></i>読み込み中...</p>
            </div>
        </section>

    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/likes.js"></script>
    <script src="js/elections.js"></script>
    <script src="js/layout.js"></script>

    <script>
    (function () {
        function initials(name) {
            return String(name || '?').replace(/\s+/g, '').slice(0, 1) || '?';
        }

        function renderPolCard(id, data) {
            const accent = data.accent || {};
            const photoSrc = data.photo_url
                ? ((/^(https?:|data:|\/)/.test(data.photo_url)) ? data.photo_url : data.photo_url)
                : '';
            const photo = photoSrc
                ? `<img class="pol-saved-photo" src="${photoSrc}" alt="${data.name}" onerror="this.parentNode.innerHTML='<div class=&quot;pol-saved-placeholder&quot;>${initials(data.name)}</div>'">`
                : `<div class="pol-saved-placeholder" style="background:${accent.color || '#1e3a6e'}">${initials(data.name)}</div>`;
            return `
                <a class="pol-saved-card" href="politicians/${id}/">
                    <button class="pol-saved-remove" data-pol-id="${id}" title="保存を解除" onclick="removePolBookmark(event,'${id}')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    ${photo}
                    <div>
                        <div class="pol-saved-name">${data.name}</div>
                        <div class="pol-saved-kana">${data.kana || ''}</div>
                    </div>
                    <div class="pol-saved-meta">${data.current_status || ''}</div>
                    <span class="pol-saved-party">${data.party || ''}</span>
                </a>`;
        }

        function renderElecCard(e) {
            const thumb = e.image
                ? `style="background-image:url('${e.image}')"` : '';
            const badgeClass = e.badgeType === 'national' ? 'badge-national' : 'badge-local';
            const badgeLabel = e.badgeType === 'national' ? '国政' : '地方';
            return `
                <a class="election-card" href="${e.url}">
                    <button class="elec-saved-remove" title="保存を解除" onclick="removeElecBookmark(event,${e.id})">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="card-thumb" ${thumb}>
                        <span class="badge ${badgeClass}">${badgeLabel}</span>
                        <span class="status-label">${e.status || ''}</span>
                    </div>
                    <div class="card-content">
                        <div class="election-title">${e.title}</div>
                        <div class="election-date">
                            <i class="fa-regular fa-calendar"></i>${e.date}
                        </div>
                        <div class="election-desc">${e.prefecture}</div>
                        <div class="card-footer-hint">
                            詳細を見る <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </a>`;
        }

        window.removePolBookmark = function(e, id) {
            e.preventDefault();
            e.stopPropagation();
            window.pBookmarks.toggle(id, 'politician');
            loadPoliticians();
        };
        window.removeElecBookmark = function(e, id) {
            e.preventDefault();
            e.stopPropagation();
            window.pBookmarks.toggle(String(id), 'election');
            loadElections();
        };

        function loadPoliticians() {
            var polGrid = document.getElementById('pol-grid');
            var ids = window.pBookmarks.getBookmarkedIds('politician');
            if (!ids.length) {
                polGrid.innerHTML = '<p class="empty-state"><i class="fa-regular fa-bookmark"></i>保存した政治家はまだいません。</p>';
                return;
            }
            polGrid.innerHTML = '<p class="empty-state"><i class="fa-regular fa-bookmark"></i>読み込み中...</p>';
            Promise.all(ids.map(function(id) {
                return fetch('data/politicians/' + id + '.json')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(data) { return data ? { id: id, data: data } : null; })
                    .catch(function() { return null; });
            })).then(function(results) {
                var html = results.filter(Boolean).map(function(r) {
                    return renderPolCard(r.id, r.data);
                }).join('');
                polGrid.innerHTML = html || '<p class="empty-state"><i class="fa-regular fa-bookmark"></i>保存した政治家はまだいません。</p>';
            });
        }

        function loadElections() {
            var elecGrid = document.getElementById('elec-grid');
            var ids = window.pBookmarks.getBookmarkedIds('election');
            if (!ids.length) {
                elecGrid.innerHTML = '<p class="empty-state"><i class="fa-regular fa-bookmark"></i>保存した選挙はまだありません。</p>';
                return;
            }
            // elections は elections.js で定義された配列
            var saved = (typeof elections !== 'undefined' ? elections : []).filter(function(e) {
                return ids.indexOf(String(e.id)) !== -1;
            });
            var html = saved.map(renderElecCard).join('');
            elecGrid.innerHTML = html || '<p class="empty-state"><i class="fa-regular fa-bookmark"></i>保存した選挙はまだありません。</p>';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadPoliticians();
            loadElections();
        });
    }());
    </script>

</body>
</html>
