name: Update shugiin tokyo 2026 data

on:
  schedule:
    - cron: "15 15 * * *" # JST 00:15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update data
        run: python scripts/update_shugiin_tokyo_2026.py

      - name: Score candidates
        run: python scripts/score_shugiin_tokyo_2026.py

      - name: Commit changes
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data/shugiin_tokyo_2026.json
            git commit -m "chore: update shugiin tokyo 2026 data"
            git push
          else
            echo "No changes"
          fi
