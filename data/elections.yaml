# 全選挙の定義 — ここだけ編集すれば全ページ・js/elections.js が再生成される
# python scripts/build.py を実行すると反映される
#
# template フィールド:
#   standard … 候補者グリッドページを自動生成
#   custom   … 手作りページ。build ではスキップ（js/elections.js には含める）

elections:

  # ── 2027 大阪 ─────────────────────────────────────────────────────────
  - id: osaka_2027_governor
    title: 大阪府知事選挙 2027
    category: local
    date: "2027年4月（予定）"
    prefecture: 大阪府
    badge_type: local
    list_status: "2027年 注目"
    list_id: 20
    list_desc: "現職の4年間の公約達成度と、新候補者のマニフェストを比較。<br>候補者情報は選管データから自動更新。"
    list_image: ""
    output_path: elections/osaka/2027_governor/index.html
    hero_from: "#1a3a1a"
    hero_to: "#2d6a2d"
    accent: "#2d6a2d"
    hero_desc: "現職の公約達成度と、新候補者のマニフェスト具体性を比較。<br>候補者情報は大阪府選挙管理委員会の公式データをもとに自動更新されます。"
    template: standard

  - id: osaka_2027_mayor
    title: 大阪市長選挙 2027
    category: local
    date: "2027年4月（予定）"
    prefecture: 大阪府
    badge_type: local
    list_status: "2027年 注目"
    list_id: 21
    list_desc: "現職の実績評価と新候補者の公約具体性を数値で比較。<br>候補者情報は選管データから自動更新。"
    list_image: ""
    output_path: elections/osaka/2027_mayor/index.html
    hero_from: "#1a1a3a"
    hero_to: "#2d2d7a"
    accent: "#2d2d7a"
    hero_desc: "現職の実績評価と、新候補者のマニフェスト具体性を比較。<br>候補者情報は大阪市選挙管理委員会の公式データをもとに自動更新されます。"
    template: standard

  # ── 2026 国政・地方 ────────────────────────────────────────────────────
  - id: nagasaki_2026_governor
    title: 長崎県知事選挙 2026
    category: local
    date: "2026年2月 予定"
    prefecture: 長崎県
    badge_type: local
    list_status: 予定
    list_id: 2
    list_desc: "石木ダム問題の行方は？<br>県政の長期的な課題を検証します。"
    list_image: ""
    output_path: elections/nagasaki/2026_governor/index.html
    hero_from: "#1a2a3a"
    hero_to: "#2d4a6a"
    accent: "#2d4a6a"
    hero_desc: "石木ダム問題の行方は？長崎県政の長期的な課題を検証します。"
    template: standard

  - id: niigata_2026_governor
    title: 新潟県知事選挙 2026
    category: local
    date: "2026年5月31日 投開票（終了）"
    prefecture: 新潟県
    badge_type: local
