  - id: niigata_2026_governor
    title: 新潟県知事選挙 2026
    category: local
    date: "2026年5月31日（日）投開票"
    prefecture: 新潟県
    badge_type: local
    list_status: "2026年 注目"
    list_id: 3
    list_desc: "柏崎刈羽原発の再稼働判断が最大争点。現職・花角英世と新人2名の三つ巴。<br>5月14日告示、5月31日投開票。"
    list_image: ""
