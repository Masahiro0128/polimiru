  - id: nagano_2026_governor
    title: 長野県知事選挙 2026
    category: local
    date: "2026年8月9日（日）投開票"
    prefecture: 長野県
    badge_type: local
    list_status: "選挙期間中"
    list_id: 4
    list_desc: "現職・阿部守一氏と元参議院議員・武田良介氏の一騎打ち。<br>暮らし、教育、地域経済、リニアをめぐる政策を比較。"
    list_image: ""
