# 全選挙の定義 — ここだけ編集すれば全ページ・js/elections.js が再生成される
# python scripts/build.py を実行すると反映される
#
# template フィールド:
#   standard … 候補者グリッドページを自動生成
#   custom   … 手作りページ。build ではスキップ（js/elections.js には含める）

elections:

  # ── 2026 福島（選挙期間中） ───────────────────────────────────────────
  - id: fukushima_2026_governor
    title: 福島県知事選挙 2026
    category: local
    date: "2026年10月25日 投開票"
    prefecture: 福島県
    badge_type: local
    list_status: "選挙期間中"
    list_id: 6
    list_desc: "10月8日告示、10月25日投開票。届出済み7候補の公約を選挙公報から整理。<br>期日前投票は10月9日〜24日。"
    list_image: ""
    output_path: elections/fukushima/2026_governor/index.html
    template: custom

  # ── 2026 愛媛（告示前） ─────────────────────────────────────────────
  - id: ehime_2026_governor
    title: 愛媛県知事選挙 2026
    category: local
    date: "2026年11月15日 投開票予定"
    prefecture: 愛媛県
    badge_type: local
    list_status: "告示前・注目"
    list_id: 7
    list_desc: "10月29日告示、11月15日投開票予定。出馬表明した3名の人物情報と確認済みの政策を整理。<br>届出候補者・選挙公報は告示後に確認。"
    list_image: ""
    output_path: elections/ehime/2026_governor/index.html
    template: custom

  # ── 2027 大阪 ─────────────────────────────────────────────────────────
  - id: osaka_2027_governor
    title: 大阪府知事選挙 2027
    category: local
    date: "2027年4月（予定）"
    prefecture: 大阪府
    badge_type: local
    list_status: "2027年 注目"
    list_id: 20
    list_desc: "現職の4年間の公約達成度と、新候補者のマニフェストを比較。<br>候補者情報は選管データから自動更新。"
    list_image: ""
    output_path: elections/osaka/2027_governor/index.html
    hero_from: "#1a3a1a"
    hero_to: "#2d6a2d"
    accent: "#2d6a2d"
    hero_desc: "現職の公約達成度と、新候補者のマニフェスト具体性を比較。<br>候補者情報は大阪府選挙管理委員会の公式データをもとに自動更新されます。"
    template: standard

  - id: osaka_2027_mayor
    title: 大阪市長選挙 2027
    category: local
    date: "2027年4月（予定）"
    prefecture: 大阪府
    badge_type: local
    list_status: "2027年 注目"
    list_id: 21
    list_desc: "現職の実績評価と新候補者の公約具体性を数値で比較。<br>候補者情報は選管データから自動更新。"
    list_image: ""
    output_path: elections/osaka/2027_mayor/index.html
